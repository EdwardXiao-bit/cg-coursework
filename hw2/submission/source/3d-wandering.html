<!DOCTYPE html>
<html style="background-color: rgba(188,190,192,1.0);">
<head>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
    <title>计算机图形学:网格建模与3D坐标变换</title>
    <style type="text/css">
        html{
            width: 100%;
            height: 100%;
        }
        body{
            margin: 0px;
            /*width: calc(100% - 10px);
            height: calc(100% - 40px);*/
            width: 100%;
            height: 100%;   
            overflow: hidden; /* 防止滚动条出现 */   
        }
    </style>
    
    <script type="text/javascript" src="./Common/webgl-utils.js"></script>
    <script type="text/javascript" src="./Common/initShaders2.js"></script>
    <script type="text/javascript" src="./Common/MVnew.js"></script>
    <script type="text/javascript" src="./models-data.js"></script>
    <script type="text/javascript" src="./3d-wandering.js"></script>
        
</head>
<body>
    <div style="display:flex; align-items:flex-start; justify-content:space-between; padding:2px 4px; color:black; font-size:0.85vw; line-height:18px;">
        <div style="display:flex; align-items:center; flex-wrap:wrap; gap:8px;">
            <text>模型：</text>
            <select id="modelSelect" onchange="modelChange(this.value)">
                <option value="cube">方块</option>
                <option value="sphere">球</option>
                <option value="hat">墨西哥帽</option>
                <option value="solar">太阳系（附加项①④）</option>
            </select>
            <label>
                <input type="checkbox" id="cullCheckbox" onchange="isCulling = this.checked; render();">
                后向面剔除(B)
            </label>
            <label>
                <input type="checkbox" id="depthCheckbox" checked onchange="isDepthTest = this.checked; render();">
                深度缓存(F)
            </label>
            <label>
                <input type="checkbox" id="axisCheckbox" checked onchange="isAxisVisible = this.checked; render();">
                自转轴(L)
            </label>
        </div>
        <div style="display:flex; justify-content:flex-end; flex-wrap:wrap; gap:10px; max-width:62%; text-align:right;">
            <text>鼠标拖动-旋转物体</text>
            <text>Z/C-放大/缩小</text>
            <text>W/S-绕X轴转</text>
            <text>A/D-绕Y轴转</text>
            <text>P-投影方式</text>
            <text>M/N-俯仰角</text>
            <text>空格-复位</text>
        </div>
    </div>
    <div style="display: flex; justify-content: center;">
        <canvas id="canvas">Oops ... your browser doesn't support the HTML5 canvas element</canvas>
    </div>
    
</body>
</html>
